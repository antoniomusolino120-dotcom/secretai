[general]
static=yes
writeprotect=yes

; Route incoming provider calls to secretai-inbound after applying the
; operator's endpoint/identify ACLs in pjsip.conf. Never expose an anonymous endpoint.
[secretai-inbound]
exten => _.,1,Answer()
 same => n,Set(CHANNEL(hangup_handler_push)=secretai-hangup,s,1)
 same => n,AGI(secretai.py,start)
 same => n,GotoIf($["${SECRET_AI_CALL_ID}" = ""]?fallback)
 same => n,AudioSocket(${SECRET_AI_CALL_ID},voice:9019)
 same => n,AGI(secretai.py,finish,${SECRET_AI_CALL_ID})
 same => n,GotoIf($["${SECRET_AI_TRANSFER}" = ""]?done)
 same => n,Dial(${SECRET_AI_TRANSFER},30)
 same => n(done),Hangup()
 same => n(fallback),Dial(${ENV(SIP_FALLBACK_CHANNEL)},30)
 same => n,Hangup()

[secretai-hangup]
exten => s,1,Return()
