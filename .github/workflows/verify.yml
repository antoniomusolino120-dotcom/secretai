name: Full verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: secretai
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: secretai_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U secretai -d secretai_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SECRET_AI_TEST_DATABASE_URL: postgresql+psycopg://secretai:ci-only-password@localhost:5432/secretai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - run: python scripts/smoke_browser.py
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag secretai:verify .
